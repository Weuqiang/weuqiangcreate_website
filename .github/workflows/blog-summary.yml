name: Daily Tech News Post

# 每日自动抓取当日最新科技消息（国际 Hacker News + 国内 36kr），翻译并组装成一篇
# 中文「科技日报」博文，补齐缺失的 description 并刷新总览 JSON，再提交回仓库。
# 仅由定时/手动触发，不在 push 时运行，避免与部署流水线互相触发形成循环。
on:
  schedule:
    # UTC 13:00 ≈ 北京时间 21:00，覆盖当日科技要闻后再生成
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 脚本仅用 Node 内置模块，无需 npm install
      - name: Generate blog summary & fill descriptions
        run: node scripts/blog-summary.js --fill

      - name: Generate daily tech-news post (科技日报)
        run: node scripts/blog-digest.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore(blog): 每日自动生成科技日报与刷新总览"
            git push
          fi
