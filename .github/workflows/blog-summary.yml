name: Daily Blog Summary

# 每日自动总结更新历史博文：补齐缺失的 description 并刷新总览 JSON，再提交回仓库。
# 仅由定时/手动触发，不在 push 时运行，避免与部署流水线互相触发形成循环。
on:
  schedule:
    # UTC 16:17 ≈ 北京时间次日 00:17；GitHub Actions 准时有抖动属正常
    - cron: "17 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 脚本仅用 Node 内置模块，无需 npm install
      - name: Generate blog summary & fill descriptions
        run: node scripts/blog-summary.js --fill

      - name: Generate daily blog digest post
        run: node scripts/blog-digest.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore(blog): 每日自动更新博文摘要与总览"
            git push
          fi
